<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control Panel - Hendy & Hades V6100 System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="glass-card border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-robot text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">
                    HENDY & HADES V6100 SYSTEM
                </h1>
                <p class="text-xs text-slate-400">Quản lý Tài khoản Hệ thống AI Tự Động & Dịch Vụ MXH</p>
            </div>
        </div>
        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Hoạt động
        </span>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
        <div class="glass-card p-6 rounded-2xl space-y-4 shadow-xl">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-indigo-300"><i class="fa-solid fa-users-gear mr-2"></i>Danh sách Tài khoản Tự động</h2>
                <button onclick="addNewAccount()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Tạo Tài Khoản Mới
                </button>
            </div>
            <div class="overflow-x-auto rounded-xl border border-slate-800">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/80 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                            <th class="p-4">Mã ID / Tài khoản</th>
                            <th class="p-4">Mật khẩu / Token</th>
                            <th class="p-4">Dịch vụ mục tiêu</th>
                            <th class="p-4">Trạng thái</th>
                            <th class="p-4 text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="accountTableBody" class="divide-y divide-slate-800/60 text-sm">
                        <tr class="hover:bg-slate-800/40 transition">
                            <td class="p-4 font-mono font-semibold text-indigo-400">bot_acc_54022</td>
                            <td class="p-4 font-mono text-amber-300">key_8d06t3</td>
                            <td class="p-4">Tăng Tim Tiktok (SL: 100)</td>
                            <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400">🟢 Hoạt động</span></td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="navigator.clipboard.writeText('bot_acc_54022 | Mật khẩu/Token: key_8d06t3'); alert('Đã copy!');" class="bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white p-2 rounded-lg transition">
                                    <i class="fa-solid fa-copy"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        function addNewAccount() {
            const accId = 'bot_acc_' + Math.floor(Math.random() * 89999 + 10000);
            const token = 'key_' + Math.random().toString(36).substring(2, 8);
            const tbody = document.getElementById('accountTableBody');
            const row = document.createElement('tr');
            row.className = 'hover:bg-slate-800/40 transition';
            row.innerHTML = `
                <td class="p-4 font-mono font-semibold text-indigo-400">${accId}</td>
                <td class="p-4 font-mono text-amber-300">${token}</td>
                <td class="p-4">Dịch vụ MXH Tự động</td>
                <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400">🟢 Hoạt động</span></td>
                <td class="p-4 text-center space-x-2">
                    <button onclick="navigator.clipboard.writeText('${accId} | Mật khẩu/Token: ${token}'); alert('Đã copy!');" class="bg-slate-800 hover:bg-indigo-600 text-slate-300 hover:text-white p-2 rounded-lg transition">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </td>
            `;
            tbody.prepend(row);
        }
    </script>
</body>
</html>
